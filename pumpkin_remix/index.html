<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8ec">
  <meta name="description" content="Listen to David Reinstein’s disco-trap remix of The Glory of the Pumpkin.">
  <meta property="og:title" content="The Glory of the Pumpkin · Disco-trap remix">
  <meta property="og:description" content="A disco-trap remix of the Thanksgiving sing-along by David Reinstein.">
  <meta property="og:type" content="music.song">
  <title>The Glory of the Pumpkin · Disco-trap remix</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fff8ec;
      --ink: #271b1a;
      --muted: #694b41;
      --accent: #963416;
      --line: #e3cec0;
      --wash: #f9e4d2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 1rem/1.55 system-ui, sans-serif;
    }

    main {
      width: min(68rem, 100% - 3rem);
      margin: clamp(1.5rem, 5vw, 4.5rem) auto;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      align-items: center;
      gap: clamp(1.5rem, 5vw, 4.5rem);
    }

    .cover {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 0.85rem;
      background: var(--wash);
    }

    .mix {
      margin: 0 0 0.75rem;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 750;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1, h2 {
      font-family: Georgia, serif;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      max-width: 12ch;
      font-size: clamp(2.65rem, 6.5vw, 5.65rem);
      line-height: 0.97;
      letter-spacing: -0.06em;
    }

    .artist { margin: 1rem 0 1.8rem; color: var(--muted); }

    audio {
      display: block;
      width: 100%;
      min-height: 54px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      column-gap: 1.25rem;
      margin-top: 0.65rem;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 650;
      text-underline-offset: 0.23em;
    }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    .sections {
      margin-top: clamp(1.8rem, 5vw, 3.5rem);
      padding-top: 1.35rem;
      border-top: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 0.9rem;
      font-size: 1.65rem;
      letter-spacing: -0.035em;
    }

    .chapters {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.5rem;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .chapters button {
      display: grid;
      grid-template-columns: 3rem 1fr;
      gap: 0.45rem;
      align-items: baseline;
      width: 100%;
      min-height: 48px;
      height: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 0.45rem;
      color: var(--ink);
      background: transparent;
      font: inherit;
      font-size: 0.9rem;
      text-align: left;
      cursor: pointer;
    }

    .chapters button:hover, .chapters button[aria-current="true"] {
      border-color: var(--accent);
      background: var(--wash);
    }

    .chapters time {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    #player-status {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0.5rem 0 0;
    }

    #player-status:empty, [hidden] { display: none; }

    @media (max-width: 660px) {
      main { width: min(34rem, 100% - 2rem); }
      .hero { grid-template-columns: 1fr; }
      .cover { max-height: 19rem; aspect-ratio: 16 / 9; }
      .artist { margin-bottom: 1.2rem; }
      .chapters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 350px) {
      .chapters { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <div class="hero">
      <div>
        <p class="mix">Disco-trap remix</p>
        <h1>The Glory of the Pumpkin</h1>
        <p class="artist">David Reinstein</p>
        <audio id="remix" aria-label="Play the disco-trap remix" controls preload="metadata"
          src="output/Glory_of_the_Pumpkin_Disco_Trap_Remix.mp3">
          The MP3 download is available below.
        </audio>
        <p id="player-status" role="status"></p>
        <div class="links">
          <a href="output/Glory_of_the_Pumpkin_Disco_Trap_Remix.mp3" download>Download MP3</a>
          <a href="https://www.youtube.com/watch?v=rMWoPkhzRvE">Original sing-along</a>
        </div>
      </div>
      <img class="cover" src="cover.webp" alt="A crowned pumpkin pie with a mustache"
        width="640" height="308">
    </div>

    <section class="sections" aria-labelledby="sections-heading" hidden>
      <h2 id="sections-heading">Jump to a section</h2>
      <ol class="chapters">
        <li><button type="button" data-start="0" aria-current="true"><time datetime="PT0S">0:00</time>Cold open</button></li>
        <li><button type="button" data-start="7.6"><time datetime="PT7.6S">0:08</time>Disco intro</button></li>
        <li><button type="button" data-start="22.6"><time datetime="PT22.6S">0:23</time>Disco verse</button></li>
        <li><button type="button" data-start="52.6"><time datetime="PT52.6S">0:53</time>Break and build</button></li>
        <li><button type="button" data-start="67.6"><time datetime="PT67.6S">1:08</time>First drop</button></li>
        <li><button type="button" data-start="97.6"><time datetime="PT97.6S">1:38</time>Trap verse</button></li>
        <li><button type="button" data-start="127.6"><time datetime="PT127.6S">2:08</time>Second build</button></li>
        <li><button type="button" data-start="142.6"><time datetime="PT142.6S">2:23</time>Final chorus</button></li>
        <li><button type="button" data-start="172.6"><time datetime="PT172.6S">2:53</time>Outro</button></li>
      </ol>
    </section>
  </main>
  <script>
    const player = document.querySelector('#remix');
    const sections = document.querySelector('.sections');
    const status = document.querySelector('#player-status');
    const chapters = [...sections.querySelectorAll('button')].reverse();
    let active = chapters[chapters.length - 1];

    function updateChapter() {
      const current = chapters.find(chapter => Number(chapter.dataset.start) <= player.currentTime + 0.01);
      if (!current || current === active) return;

      active.removeAttribute('aria-current');
      current.setAttribute('aria-current', 'true');
      active = current;
    }

    for (const chapter of chapters) {
      chapter.addEventListener('click', async () => {
        status.textContent = '';
        player.currentTime = Number(chapter.dataset.start);
        try {
          await player.play();
        } catch {
          status.textContent = 'Playback could not start. Try the player controls or download the MP3.';
        }
      });
    }

    player.addEventListener('playing', () => { status.textContent = ''; });
    player.addEventListener('timeupdate', updateChapter);
    player.addEventListener('error', () => {
      status.textContent = 'The player could not load the track. Try the MP3 download.';
    });
    if (player.error) status.textContent = 'The player could not load the track. Try the MP3 download.';
    sections.hidden = false;
  </script>
</body>
</html>
