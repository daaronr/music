name: Test Blues Flow and publish Pages redirects

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: blues-app
        run: npm install

      - name: Test
        working-directory: blues-app
        run: npm test

      - name: Build
        working-directory: blues-app
        run: npm run build

      # The live copies are on Netlify (blues-flow, kay-house). Pages now only
      # redirects old daaronr.github.io/music/ links there, so there is one
      # version of each site. index.html and 404.html are the same redirect page.
      - name: Assemble redirect site
        run: |
          mkdir -p pages_out
          cp pages_redirect/index.html pages_out/index.html
          cp pages_redirect/index.html pages_out/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
