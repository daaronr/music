<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks - K-House</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<style>
  :root {
    --brass: #c99238;
    --ink: #101418;
    --paper: #f4efe6;
    --text: #ece7dc;
    --muted: #b8afa2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background: #101418;
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.6;
  }
  main {
    width: min(620px, 100%);
    border: 1px solid rgba(244,239,230,0.16);
    border-radius: 6px;
    background: rgba(255,255,255,0.045);
    padding: 2rem;
  }
  h1 {
    color: var(--paper);
    font-size: clamp(2rem, 5vw, 3rem);
    line-height: 1.05;
    margin: 0 0 1rem;
  }
  p { color: var(--muted); }
  a { color: var(--brass); }
</style>
</head>
<body>
<main>
  <h1>Thanks</h1>
  <p>Your K-House site input has been submitted.</p>
  <p>You can submit the form again if you think of more details, find another link, or want to upload more material later.</p>
  <p><a href="bandmates.html">Return to the input page</a> or <a href="index.html">go to the public site</a>.</p>
</main>
</body>
</html>
